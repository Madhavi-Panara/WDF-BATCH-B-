<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <header class="top-bar">

        <div class="logo">
            Student Portal
        </div>

        <nav>
            <a href="studentportal.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="register-container">

        <div class="register-heading">
            <p class="small-title">STUDENT PORTAL</p>
            <h1>Create Your Account</h1>
            <p>Register your account to access the Student Portal.</p>
        </div>


        <div class="register-box">

            <form id="registrationForm" action="login.html">

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName"
                            placeholder="Enter first name" required>
                        <span class="error" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName"
                            placeholder="Enter last name" required>
                        <span class="error" id="lastNameError"></span>
                    </div>

                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email address" required>
                    <span class="error" id="emailError"></span>
                </div>


                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId"
                        placeholder="Enter your student ID" required>
                    <span class="error" id="studentIdError"></span>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course" required>
                            <option value="">Select course</option>
                            <option value="btech">B.Tech</option>
                            <option value="bca">BCA</option>
                            <option value="mca">MCA</option>
                            <option value="bba">BBA</option>
                            <option value="other">Other</option>
                        </select>
                        <span class="error" id="courseError"></span>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" name="year" required>
                            <option value="">Select year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <span class="error" id="yearError"></span>
                    </div>

                </div>


                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile"
                        placeholder="Enter your mobile number" required>
                    <span class="error" id="mobileError"></span>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                            placeholder="Create a password" required>

                        <p id="passwordStrength"></p>

                        <span class="error" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password" required>

                        <span class="error" id="confirmPasswordError"></span>
                    </div>

                </div>


                <div class="form-check">

                    <input type="checkbox" id="terms" name="terms" required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>

                    <span class="error" id="termsError"></span>

                </div>


                <button type="submit" class="register-button">
                    Create Account
                </button>


                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </form>

        </div>

    </main>


    <script src="registration.js"></script>

</body>
</html>

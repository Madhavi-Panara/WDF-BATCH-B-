
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="portal-name">Student Portal</div>
    <nav class="navigation">
        <a href="../studentportal.html">Home</a>
        <a href="../profile.html">Profile</a>
        <a href="../courses.html">Courses</a>
        <a href="../schedule.html">Schedule</a>
        <a href="../resourses.html">Resources</a>
        <a href="index.html" class="active">Events</a>
    </nav>
</header>

<main class="events-container">
    <section class="event-heading">
        <p class="heading-small">CAMPUS ACTIVITIES</p>
        <h1>Our Events</h1>
        <p>Explore and manage the latest events happening in our college.</p>
    </section>

    <section class="toolbar">
        <input type="search" id="search" placeholder="Search events...">

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Technical">Technical</option>
            <option value="Workshop">Workshop</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
            <option value="Other">Other</option>
        </select>

        <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
        </select>

        <select id="sortBy">
            <option value="date">Sort by Date</option>
            <option value="nameAsc">Name A-Z</option>
            <option value="nameDesc">Name Z-A</option>
        </select>
    </section>

    <p id="loading">Loading events...</p>
    <p id="message"></p>

    <section class="form-panel">
        <h2 id="formTitle">Add New Event</h2>

        <form id="eventForm">
            <input type="hidden" id="event_id">

            <label>Event Name
                <input type="text" id="event_name" required>
            </label>

            <label>Event Date
                <input type="date" id="event_date" required>
            </label>

            <label>Category
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Technical">Technical</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option>
                    <option value="Other">Other</option>
                </select>
            </label>

            <label>Location
                <input type="text" id="location" required>
            </label>

            <label>Description
                <textarea id="description" rows="3"></textarea>
            </label>

            <label>Status
                <select id="status">
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                </select>
            </label>

            <label>Poster (JPG, PNG or WEBP, maximum 2 MB)
                <input type="file" id="poster" accept=".jpg,.jpeg,.png,.webp">
            </label>

            <button type="submit" id="saveButton">Save Event</button>
            <button type="button" id="cancelButton" hidden>Cancel Edit</button>
        </form>
    </section>

    <section class="list-heading">
        <h2>Event List</h2>
        <p id="eventCount">0 events</p>
    </section>

    <section class="event-grid" id="eventGrid"></section>
    <p id="emptyState" hidden>No events found.</p>
</main>

<script src="script.js"></script>
</body>
</html>

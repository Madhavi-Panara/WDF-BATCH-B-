<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <table class="navbar" width="100%" cellpadding="10">
    <tr>
      <td><span class="brand">Student Portal</span></td>
      <td align="right" cellpadding="10">
        <a href="studentportal.html" class="home-link">Home</a>
      </td>
    </tr>
  </table>

  <div class="login-wrapper">

    <div class="login-illustration">
      <img src="login.png" alt="Login illustration" class="illustration-img">
      <h2 class="illustration-title">Welcome Back</h2>
      <p class="illustration-text">Login to continue your academic journey</p>
    </div>

    <div class="login-panel">
      <h1 class="login-title">Student Login</h1>
      <p class="login-description">Enter your credentials to access your dashboard</p>

      <div class="login-box">
        <label class="login-label" for="username">Username</label>
        <input type="text" id="username" class="login-input" placeholder="Enter your username">

        <label class="login-label" for="password">Password</label>
        <input type="password" id="password" class="login-input" placeholder="Enter your password">

        <div class="login-options">
          <label class="remember"><input type="checkbox"> Remember me</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="button" id="loginBtn" class="login-button">LOGIN</button>

        <p class="signup-text">New here? <a href="#" class="signup-link">Create an account</a></p>
      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>

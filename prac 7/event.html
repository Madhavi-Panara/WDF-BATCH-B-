<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="event.css">
</head>
<body>

        <main class="registration-container">

        <div class="registration-header">
            <p class="small-title">EVENT REGISTRATION</p>
            <h1>Register for Event</h1>
            <p>
                Fill in the details below to register for the selected event.
            </p>
        </div>


        <div class="registration-box">

        <form action="process.php" method="POST">

        <div class="form-group">
        <label for="event">Select Event</label>
        <select id="event" name="event">
        <option value="">Select an event</option>
        <option value="ui-ux">Basic UI & UX Design Workshop - 15 August 2026</option>
        <option value="digital-education">Digital Education Workshop - 20 August 2026</option>
        <option value="learning-network">Learning Network Webinar - 25 August 2026</option>
        <option value="coding">Coding Competition - 30 August 2026</option>
        <option value="cultural-fest">College Cultural Fest - 5 September 2026</option>
        <option value="book-reading">Book Reading Session - 10 September 2026</option>
        <option value="ui-ux">AI & Machine Learning Seminar - 15 September 2026</option>
        <option value="digital-education">Football Tournament - 20 September 2026</option>
        <option value="learning-network">Resume Building Workshop - 25 September 2026</option>
        <option value="coding">Dance Competition - 10 october 2026</option>
        <option value="cultural-fest">Cyber Security Awareness - 5 october 2026</option>
        <option value="book-reading">Basketball Tournament - 10 october 2026</option>
        <option value="ui-ux">Java Programming Workshop - 15 october 2026</option>
        <option value="digital-education">Photography Workshop - 20 october 2026</option>
        <option value="learning-network">Badminton Championship - 25 october 2026</option>
    </select>

</div>


            <form>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course">
                            <option value="">Select your course</option>
                            <option value="btech">B.Tech</option>
                            <option value="bca">BCA</option>
                            <option value="mca">MCA</option>
                            <option value="bba">BBA</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" name="year">
                            <option value="">Select year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                </div>


                <div class="form-group">
                    <label for="message">Additional Message</label>
                    <textarea id="message" name="message" rows="4"
                        placeholder="Enter any additional information"></textarea>
                </div>


                <div class="form-check">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">
                        I confirm that the information provided is correct.
                    </label>
                </div>


                <button type="submit" class="register-button">
                    Register for Event
                </button>

            </form>

        </div>

    </main>

</body>
</html>
